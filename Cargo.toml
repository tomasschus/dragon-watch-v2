[package]
name = "resumen-watch"
version = "0.1.0"
edition = "2021"
resolver = "2"

[dependencies]
esp-hal = { version = "1.1.1", features = ["esp32s3", "unstable"] }
esp-backtrace = { version = "0.19.0", features = ["esp32s3", "panic-handler", "println"] }
esp-println = { version = "0.17.0", features = ["esp32s3"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3"] }
esp-alloc = "0.10.0"
esp-rtos = { version = "0.3.0", features = ["esp32s3", "embassy"] }
embassy-executor = "0.10"
embassy-time = "0.5"
embassy-futures = "0.1"
embassy-sync = "0.8"
sh8601-rs = { version = "0.1.8", features = ["waveshare_18_amoled"] }
embedded-hal = "1.0.0"
embedded-io-async = "0.7"
embedded-graphics = "0.8.2"
heapless = "0.8.0"
static_cell = "2.1.0"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = false

[profile.dev]
opt-level = "s"
